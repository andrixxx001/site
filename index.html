<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Minhas Finanças</title>
<style>
  body{font-family:system-ui,sans-serif;background:#111;color:#eee;margin:0;padding:16px}
  .wrap{max-width:560px;margin:0 auto}
  h1{font-size:22px;margin:8px 0 16px}
  .card{background:#1c1c1c;border-radius:12px;padding:16px;margin-bottom:16px}
  .nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:16px}
  .nav .mes{font-size:18px;font-weight:700;text-align:center;flex:1}
  .nav button{background:#262626;color:#eee;border:0;border-radius:8px;padding:10px 14px;font-size:16px;cursor:pointer}
  .nav button:hover{background:#333}
  .hoje{font-size:13px !important}
  .row{display:flex;gap:8px;align-items:center;border-bottom:1px solid #2a2a2a;padding:2px 0}
  input,select{background:transparent;border:0;border-bottom:1px solid transparent;color:inherit;font:inherit;padding:8px 4px;min-width:0}
  input:focus,select:focus{outline:0;border-bottom-color:#666}
  select{background:#262626;border-radius:6px;border:0;padding:6px 8px;font-size:13px}
  option{background:#262626}
  .nome{flex:1}
  .valor{width:110px;text-align:right}
  .titulo{flex:1;font-size:16px;font-weight:700}
  .head{display:flex;gap:8px;align-items:center;margin-bottom:8px}
  .del{background:none;border:0;color:#777;font-size:18px;cursor:pointer;padding:6px}
  .del:hover{color:#ff6b6b}
  .add{width:100%;margin-top:10px;padding:10px;background:#262626;color:#ccc;border:1px dashed #444;border-radius:8px;font:inherit;cursor:pointer}
  .add:hover{background:#2e2e2e}
  .total{display:flex;justify-content:space-between;font-weight:700;font-size:17px;padding-top:12px}
  .neg{color:#ff6b6b}
  .pos{color:#4ade80}
  .saldo{text-align:center;font-size:28px;font-weight:700;margin:6px 0}
